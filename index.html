<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEIGE VIBES</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:'SF Pro Display',sans-serif}
        body{background:#f5f0e9;color:#333;max-width:1200px;margin:0 auto;padding:40px 20px}
        .header{text-align:center;margin-bottom:50px}
        h1{font-weight:500;font-size:26px;letter-spacing:2px;color:#444}
        .sub{color:#999;font-size:14px;margin-top:6px}
        .upload{border:1px dashed #d9d2c5;border-radius:20px;padding:50px;text-align:center;margin-bottom:60px;cursor:pointer;background:#faf7f2;transition:all .3s}
        .upload:hover{border-color:#c5b9a7;background:#fff}
        .upload-icon{font-size:42px;color:#b8a996;margin-bottom:15px}
        #file{display:none}
        .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:24px}
        .item{aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:#eee}
        .item img{width:100%;height:100%;object-fit:cover;transition:transform .5s ease}
        .item:hover img{transform:scale(1.08)}
    </style>
</head>
<body>
    <div class="header">
        <h1>LIFE RECORD</h1>
        <p class="sub">Soft & Warm Moments</p>
    </div>

    <div class="upload" onclick="document.getElementById('file').click()">
        <div class="upload-icon">↑</div>
        <p>upload pics</p>
        <input type="file" id="file" accept="image/*" multiple onchange="upload(event)">
    </div>

    <div class="grid" id="grid"></div>

    <script>
        let data=JSON.parse(localStorage.getItem('beigeImg'))||[];
        const grid=document.getElementById('grid');
        function render(){
            grid.innerHTML='';
            data.forEach(src=>{
                const d=document.createElement('div');
                d.className='item';
                d.innerHTML=`<img src="${src}">`;
                grid.appendChild(d);
            });
        }
        render();
        function upload(e){
            const fs=e.target.files;
            for(let f of fs){
                const r=new FileReader();
                r.onload=res=>{
                    data.unshift(res.target.result);
                    localStorage.setItem('beigeImg',JSON.stringify(data));
                    render();
                };
                r.readAsDataURL(f);
            }
            e.target.value='';
        }
    </script>
</body>
</html>
